<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Stage Select</title>

    <link
        rel="stylesheet"
        href="css/stage select.css"
    >


</head>


<body>

    <main id="stage-select">


        <!-- BACKGROUND -->

        <img
            src="assets/images/background.svg"
            id="stage-background"
            alt=""
        >


        <!-- TITLE -->

        <h1>
            STAGE SELECT
        </h1>


        <!-- STAGE LIST -->

        <div id="stage-list">


            <!-- STAGE 1 -->

            <button
                class="stage-card"
                data-stage="1"
            >

                <div class="stage-image-wrapper">

                    <img
                        src="assets/images/stage1.svg"
                        alt="Stage 1"
                        class="stage-image"
                    >

                </div>

                <div class="stage-name">
                    LEVEL 1
                </div>

                <div class="stage-number">
                    STAGE 1
                </div>

            </button>


            <!-- STAGE 2 -->

            <button
                class="stage-card"
                data-stage="2"
            >

                <div class="stage-image-wrapper">

                    <img
                        src="assets/images/stage2.svg"
                        loading="lazy"
                        alt="Stage 2"
                        class="stage-image"
                    >

                </div>

                <div class="stage-name">
                    LEVEL 2
                </div>

                <div class="stage-number">
                    STAGE 2
                </div>

            </button>


            <!-- STAGE 3 -->

            <button
                class="stage-card"
                data-stage="3"
            >

                <div class="stage-image-wrapper">

                    <img
                        src="assets/images/stage3.svg"
                        loading="lazy"
                        alt="Stage 3"
                        class="stage-image"
                    >

                </div>

                <div class="stage-name">
                    LEVEL 3
                </div>

                <div class="stage-number">
                    STAGE 3
                </div>

            </button>


        </div>


        <!-- BACK BUTTON -->

        <button
            id="back-button"
        >
            BACK
        </button>


    </main>


    <script src="js/stage select.js"></script>

</body>

</html>
