<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stage 3</title>
<link rel="stylesheet" href="css/gameplay.css">
</head>
<body>
<main id="game" data-stage="3">
  <img id="game-background" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
  <div id="stage-label">LEVEL 3</div>
  <div id="character-shadow"></div>
  <div id="player">
    <img src="assets/animation DaiTrang/dai-trang-run.svg" alt="Đài Trang chạy">
  </div>
  <div id="controls">
    <div id="left-controls">
      <button id="jump-btn" class="control-btn">↑</button>
    </div>
    <div id="move-controls">
      <button id="left-btn" class="control-btn">←</button>
      <button id="right-btn" class="control-btn">→</button>
    </div>
  </div>
  <button id="back-level" class="game-btn">BACK</button>
  <div id="hint">A / D hoặc ← / → di chuyển · ↑ nhảy</div>
</main>
<script src="js/gameplay.js"></script>
</body>
</html>
