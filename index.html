<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Game của tôi</title>

    <link rel="preload" as="image" href="assets/images/background.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main id="home">


        <!-- =========================
             BACKGROUND
        ========================== -->

        <img
            src="assets/images/background.svg"
            id="game-background"
            alt=""
        >


        <!-- =========================
             MENU
        ========================== -->

        <div id="menu">


            <!-- LOGO -->

            <img
                src="assets/images/logo.png"
                id="game-logo"
                alt="Logo game"
            >


            <!-- BUTTONS -->

            <div id="menu-buttons">


                <button class="stage-button">
                    START
                </button>


                <button class="stage-button">
                    CHARACTER SELECT
                </button>


                <button class="stage-button">
                    HOW TO PLAY
                </button>


            </div>


        </div>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
